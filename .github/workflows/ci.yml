# Continuous integration: every branch push runs the shared build, test, smoke, package and verify workflow
# (build.yml) on windows-latest and macos-latest, and uploads the two zips as 7-day workflow artifacts.
# Tag pushes do not run here; release.yml builds and publishes tags (D53).
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
