# Compile, test, smoke, package and verify DialShift on native runners (brief 1 §4.5, §8; decisions D2 as amended by D13, D7, D8,
# D53). The one definition of the build: ci.yml calls it on every branch push, release.yml calls it for a tag before
# publishing, so a release ships only packages that passed exactly these checks.
# Phases per job: build -> test -> native UI smoke -> package -> verify the downloadable zip (macOS: and launch
# the app extracted from it) -> upload.
# New checks (for example headless smokes) go in as steps of the matching phase.
# The caller sets concurrency.
name: Build, test and package

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out, for example refs/tags/v0.3.0-rc.1. Empty means the caller's ref.
        type: string
        default: ''
      version:
        description: >-
          SemVer passed to the package scripts (--version / -Version), for example 0.3.0-rc.1. Its MAJOR.MINOR.PATCH
          must equal the csproj <Version> (D53). Empty means the csproj <Version>.
        type: string
        default: ''
      build-number:
        description: macOS CFBundleVersion (--build-number), one to three dot-separated integers. Empty means the csproj <Version>.
        type: string
        default: ''
      nuget-cache:
        description: Restore and save the NuGet package cache. Release builds turn it off so they restore from nuget.org only.
        type: boolean
        default: true

# Read-only whatever the caller grants: nothing here writes to the repository.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Honest-labeling suffix of the macOS artifact (brief 1 §4.3). "native-avplayer": the native
  # osx-arm64 AVPlayer build, which passed SP-01/SP-02 (docs/acceptance-matrix.md) and the native
  # smoke below. scripts/build-mac-app.sh reads the same variable for the zip name.
  MACOS_LABEL: native-avplayer

jobs:
  build-test-package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64), matching the osx-arm64 target (D13).
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        if: inputs.nuget-cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Build: the whole solution (Core, Tests, App), no RID, warnings as errors.
      - name: Build DialShift.slnx
        run: dotnet build DialShift.slnx -c Release -warnaserror

      # Test: a non-zero exit code fails the job.
      - name: Test DialShift.Tests
        run: dotnet run --project DialShift.Tests/DialShift.Tests.csproj -c Release

      # Native UI smoke (brief 1 §4.5 level 3; acceptance matrix §4): the real app, window, tray, dialogs, engine
      # and a real second launch, in a fresh temp data folder. The app writes results.json and screenshots, exits
      # non-zero when any check fails, and has its own watchdog (300 s with --recovery-test).
      # Both hosted runners give the job an interactive desktop session: macOS has a logged-in GUI session and
      # Windows runs the agent in the interactive session with Explorer's notification area.
      - name: Build DialShift.App for ${{ matrix.rid }}
        run: dotnet build DialShift.App/DialShift.App.csproj -c Release -r ${{ matrix.rid }} -warnaserror -o "${{ runner.temp }}/smoke-app"

      - name: Native UI smoke (--smoke-test --recovery-test)
        shell: pwsh
        timeout-minutes: 8
        env:
          # Windows runners have no audio device; LibVLC's dummy audio output lets the engine reach Playing.
          # Read by the playback composition (DIALSHIFT_AUDIO_OUTPUT); ignored on macOS.
          DIALSHIFT_AUDIO_OUTPUT: ${{ runner.os == 'Windows' && 'dummy' || '' }}
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'smoke-app' ($IsWindows ? 'DialShift.exe' : 'DialShift')
          $output = Join-Path $env:RUNNER_TEMP 'smoke'
          # Started directly rather than with & or Start-Process: pwsh does not wait for a Windows GUI-subsystem exe.
          $start = [System.Diagnostics.ProcessStartInfo]::new($app)
          foreach ($arg in '--smoke-test', '--recovery-test', '--output', $output) { $start.ArgumentList.Add($arg) }
          $process = [System.Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit([TimeSpan]::FromMinutes(6))) {
            $process.Kill($true)
            throw 'The smoke run did not exit within 6 minutes.'
          }
          $resultsFile = Join-Path $output 'results.json'
          if (-not (Test-Path $resultsFile)) { throw "The smoke run exited with code $($process.ExitCode) and wrote no results.json." }
          $results = Get-Content $resultsFile -Raw | ConvertFrom-Json
          $rows = $results.checks | ForEach-Object {
            $state = if ($_.skipped) { 'skipped' } elseif ($_.passed) { 'passed' } else { 'FAILED' }
            "| $state | $($_.name) | $($_.detail -replace '\|', '/' -replace '\s+', ' ') |"
          }
          @("### Native UI smoke ($env:RUNNER_OS, $($results.engine))", '', '| Result | Check | Detail |', '|---|---|---|') + $rows |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          $results.checks | Where-Object { -not $_.passed } |
            ForEach-Object { Write-Host "::error title=Smoke: $($_.name)::$($_.detail -replace '\s+', ' ')" }
          if ($process.ExitCode -ne 0) { throw "The smoke run exited with code $($process.ExitCode)." }

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-${{ matrix.rid }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
          retention-days: 7

      # Package: the release scripts are the single source of the artifact layout. The inputs reach the scripts
      # through the environment, never through expressions in the script text; the scripts validate them.
      - name: Package win-x64 zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/build.ps1 -SkipTests -Version $env:VERSION

      - name: Package osx-arm64 app bundle and zip
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build-number }}
        run: scripts/build-mac-app.sh ${VERSION:+--version "$VERSION"} ${BUILD_NUMBER:+--build-number "$BUILD_NUMBER"}

      # Verify: re-run the packaging checks on the bundle extracted from the zip a user downloads.
      - name: Verify win-x64 zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extracted = Join-Path $env:RUNNER_TEMP 'DialShift-win-x64'
          Expand-Archive -LiteralPath artifacts/DialShift-win-x64.zip -DestinationPath $extracted
          ./scripts/verify-win-package.ps1 -Path $extracted

      # Install.ps1 (SW-N4, D56) from the folder extracted above, run as "Run with PowerShell" runs it (Windows
      # PowerShell 5.1), with LOCALAPPDATA in a temp folder and -NoLaunch, so no DialShift is started:
      # (a) a fresh install; (b) an upgrade over it, which leaves no file of the old build and no DialShift.new-* or
      # DialShift.old-* folder, and moves an existing HKCU Run value to the installed copy; (c) a copy extracted inside
      # the install folder and (d) an install folder inside the source are refused with a non-zero exit, changing nothing.
      # The HKCU Run value is restored and the Start menu shortcut removed afterwards.
      - name: Install.ps1 (fresh install, upgrade, refusals)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'DialShift-win-x64'
          $root = Join-Path $env:RUNNER_TEMP 'install-check'
          $outer = Join-Path $env:RUNNER_TEMP 'install-check-outer'
          $programs = Join-Path $root 'Programs'
          $installed = Join-Path $programs 'DialShift'
          $installedExe = Join-Path $installed 'DialShift.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'DialShift.lnk'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $savedRun = (Get-ItemProperty -Path $runKey -Name DialShift -ErrorAction SilentlyContinue).DialShift
          function Invoke-Install([string]$folder, [string]$localAppData) {
            $saved = $env:LOCALAPPDATA
            $env:LOCALAPPDATA = $localAppData
            try {
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $folder 'Install.ps1') -NoLaunch | Out-Host
              return $LASTEXITCODE
            } finally { $env:LOCALAPPDATA = $saved }
          }
          function Get-Listing([string]$folder) {
            Get-ChildItem -LiteralPath $folder -Recurse -Force -File |
              ForEach-Object { '{0} {1}' -f $_.FullName.Substring($folder.Length), $_.Length } | Sort-Object
          }
          function Assert-OnlyInstall([string]$case) {
            $names = @(Get-ChildItem -LiteralPath $programs -Force | ForEach-Object Name)
            if ("$names" -ne 'DialShift') { throw "($case) $programs holds '$($names -join "', '")', expected only DialShift." }
          }
          try {
            $code = Invoke-Install $package $root
            if ($code -ne 0) { throw "(a) Fresh install: Install.ps1 exited with $code." }
            if (-not (Test-Path -LiteralPath $installedExe)) { throw "(a) Fresh install: $installedExe is missing." }
            Assert-OnlyInstall 'a'
            $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
            if ($target -ne $installedExe) { throw "(a) The Start menu shortcut points at '$target', expected $installedExe." }
            Write-Host '(a) Fresh install: passed.'

            Set-Content -LiteralPath (Join-Path $installed 'only-in-old-build.txt') -Value 'old'
            Set-ItemProperty -Path $runKey -Name DialShift -Value '"C:\Old\DialShift\DialShift.exe" --tray'
            $code = Invoke-Install $package $root
            if ($code -ne 0) { throw "(b) Upgrade: Install.ps1 exited with $code." }
            if (-not (Test-Path -LiteralPath $installedExe)) { throw "(b) Upgrade: $installedExe is missing." }
            if (Test-Path -LiteralPath (Join-Path $installed 'only-in-old-build.txt')) { throw '(b) Upgrade: a file of the old build is still there.' }
            Assert-OnlyInstall 'b'
            $run = (Get-ItemProperty -Path $runKey -Name DialShift).DialShift
            if ($run -ne "`"$installedExe`" --tray") { throw "(b) Upgrade: the Run value is '$run', expected `"$installedExe`" --tray." }
            Write-Host '(b) Upgrade: passed.'

            $nested = Join-Path $installed 'extracted'
            Copy-Item -LiteralPath $package -Destination $nested -Recurse
            $before = Get-Listing $installed
            $code = Invoke-Install $nested $root
            if ($code -eq 0) { throw '(c) Install.ps1 run from inside the install folder exited with 0.' }
            if (Compare-Object $before (Get-Listing $installed)) { throw '(c) The refused run changed the install folder.' }
            Assert-OnlyInstall 'c'
            Write-Host "(c) Source inside the install folder: refused with exit code $code, install unchanged."

            Copy-Item -LiteralPath $package -Destination $outer -Recurse
            $code = Invoke-Install $outer $outer
            if ($code -eq 0) { throw '(d) Install.ps1 with the install folder inside its own folder exited with 0.' }
            if (Test-Path -LiteralPath (Join-Path $outer 'Programs')) { throw '(d) The refused run created an install folder.' }
            Write-Host "(d) Install folder inside the source: refused with exit code $code."

            $started = @(Get-Process DialShift -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -like "$root\*" -or $_.Path -like "$outer\*" })
            if ($started.Count -gt 0) { $started | Stop-Process -Force; throw 'Install.ps1 -NoLaunch started DialShift.' }
          } finally {
            if ($null -eq $savedRun) { Remove-ItemProperty -Path $runKey -Name DialShift -ErrorAction SilentlyContinue }
            else { Set-ItemProperty -Path $runKey -Name DialShift -Value $savedRun }
            Remove-Item -LiteralPath $shortcut -Force -ErrorAction SilentlyContinue
          }
          # The refused runs exit non-zero on purpose; the checks above decide the step's result.
          $global:LASTEXITCODE = 0

      # verify-mac-app.sh --zip asserts that the zip has no AppleDouble ._* entries, extracts it with ditto and
      # with unzip, and checks each bundle: arm64-only executable, arm64 slice in every dylib, only Mach-O files in
      # Contents/MacOS (SR-03), no signature in extended attributes, no libvlc*/VLC dylibs (case-sensitive;
      # LibVLCSharp.dll is allowed), Info.plist identity/icon keys, LSUIElement=true,
      # NSAppTransportSecurity:NSAllowsArbitraryLoadsForMedia=true, exec bit, and a valid ad-hoc signature.
      - name: Verify osx-arm64 zip
        if: runner.os == 'macOS'
        run: scripts/verify-mac-app.sh --zip "dist/DialShift-osx-arm64-${MACOS_LABEL}.zip"

      # The smoke above runs the build output; this one launches the packaged app a user gets, extracted with
      # unzip (the stricter extractor), so the bundle layout, the host's application folder and the ATS media
      # exception are exercised through the real bundled executable.
      - name: Bundle smoke (packaged osx-arm64 app, --smoke-test)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          unzip -q "dist/DialShift-osx-arm64-${MACOS_LABEL}.zip" -d "$RUNNER_TEMP/bundle"
          output="$RUNNER_TEMP/bundle-smoke"
          if ! "$RUNNER_TEMP/bundle/DialShift.app/Contents/MacOS/DialShift" --smoke-test --output "$output"; then
            if [ -f "$output/results.json" ]; then
              jq -r '.checks[] | select(.passed | not) | "::error title=Bundle smoke: \(.name)::\(.detail)"' "$output/results.json"
            fi
            echo "::error title=Bundle smoke::The packaged app's smoke run failed (see the bundle-smoke artifact)."
            exit 1
          fi
          jq -r '"Bundle smoke: \([.checks[] | select(.passed)] | length)/\(.checks | length) checks passed (\(.engine))"' "$output/results.json" |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle smoke results
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: bundle-smoke-${{ matrix.rid }}
          path: ${{ runner.temp }}/bundle-smoke
          if-no-files-found: ignore
          retention-days: 7

      # Upload: the zips are uploaded as-is (the macOS zip keeps permissions, links and the signature).
      # Short retention keeps artifact storage bounded; release.yml's publish job downloads the DialShift-* artifacts
      # within the same run and attaches them to the GitHub Release, which is where they are kept.
      - name: Upload win-x64 artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: DialShift-win-x64
          path: artifacts/DialShift-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload osx-arm64 artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: DialShift-osx-arm64-${{ env.MACOS_LABEL }}
          path: dist/DialShift-osx-arm64-${{ env.MACOS_LABEL }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
