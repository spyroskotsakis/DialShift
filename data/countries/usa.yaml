code: US
name: United States
language_default: English
# A curated-only country: ONLY the entries below ship (no Wikipedia list, no radio-browser
# extras) — the full US directory (~30,000 stations) would dwarf the app catalog's budget.
# Two families: tech-radio stations (dedicated technology programming) and the most
# famous / biggest-audience US stations. Stations whose stream could not be verified from
# this network carry `no_auto_stream: true` — an honest identity row, never an invented URL.
